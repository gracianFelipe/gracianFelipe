<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64"
     viewBox="0 0 900 64" role="img"
     aria-label="Do banco de dados à interface · Web, mobile e automação em produção · Sistema que alguém usa todo dia · Demo navegável > screenshot bonito">
  <defs>
    <style>
      @font-face{font-family:"Space Mono";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
      /* Estado de repouso: sem a animação, nada ocupa espaço. */
      .faixa,.corte{width:0}
      /*
       * No claro a barra escura é o que torna o ácido legível; no escuro
       * ela seria mais clara que o fundo do GitHub e viraria mancha, então
       * vira um brilho da própria cor do texto.
       */
      .faixa{fill:#1c1c1c;fill-opacity:1}
      @media (prefers-color-scheme:dark){.faixa{fill:#d0fa66;fill-opacity:.13}}
      .l0 .faixa{animation:b0 16707ms infinite}.c0{animation:t0 16707ms infinite}
      .l1 .faixa{animation:b1 16707ms infinite}.c1{animation:t1 16707ms infinite}
      .l2 .faixa{animation:b2 16707ms infinite}.c2{animation:t2 16707ms infinite}
      .l3 .faixa{animation:b3 16707ms infinite}.c3{animation:t3 16707ms infinite}
      /* Quem pediu menos movimento vê a primeira frase parada, por inteiro. */
      @media (prefers-reduced-motion:reduce){
        .faixa,.corte{animation:none!important}
        .l0 .faixa{width:442.46px}
        .c0{width:390.46px}
      }
      @keyframes t0{0.0%{width:0px;animation-timing-function:step-end}0.0%{width:0px;animation-timing-function:steps(29)}9.5469%{width:390.46px;animation-timing-function:step-end}18.5252%{width:390.46px;animation-timing-function:steps(29)}23.3854%{width:0px;animation-timing-function:step-end}100.0%{width:0px;animation-timing-function:step-end}}
      @keyframes b0{0.0%{width:0px;animation-timing-function:step-end}0.0%{width:0px;animation-timing-function:steps(29)}9.5469%{width:442.46px;animation-timing-function:step-end}18.5252%{width:442.46px;animation-timing-function:steps(29)}23.3854%{width:0px;animation-timing-function:step-end}100.0%{width:0px;animation-timing-function:step-end}}
      @keyframes t1{0.0%{width:0px;animation-timing-function:step-end}23.3854%{width:0px;animation-timing-function:steps(35)}34.9075%{width:471.24px;animation-timing-function:step-end}43.8858%{width:471.24px;animation-timing-function:steps(35)}49.7516%{width:0px;animation-timing-function:step-end}100.0%{width:0px;animation-timing-function:step-end}}
      @keyframes b1{0.0%{width:0px;animation-timing-function:step-end}23.3854%{width:0px;animation-timing-function:steps(35)}34.9075%{width:523.24px;animation-timing-function:step-end}43.8858%{width:523.24px;animation-timing-function:steps(35)}49.7516%{width:0px;animation-timing-function:step-end}100.0%{width:0px;animation-timing-function:step-end}}
      @keyframes t2{0.0%{width:0px;animation-timing-function:step-end}49.7516%{width:0px;animation-timing-function:steps(31)}59.9569%{width:417.38px;animation-timing-function:step-end}68.9352%{width:417.38px;animation-timing-function:steps(31)}74.1306%{width:0px;animation-timing-function:step-end}100.0%{width:0px;animation-timing-function:step-end}}
      @keyframes b2{0.0%{width:0px;animation-timing-function:step-end}49.7516%{width:0px;animation-timing-function:steps(31)}59.9569%{width:469.38px;animation-timing-function:step-end}68.9352%{width:469.38px;animation-timing-function:steps(31)}74.1306%{width:0px;animation-timing-function:step-end}100.0%{width:0px;animation-timing-function:step-end}}
      @keyframes t3{0.0%{width:0px;animation-timing-function:step-end}74.1306%{width:0px;animation-timing-function:steps(34)}85.3235%{width:457.78px;animation-timing-function:step-end}94.3018%{width:457.78px;animation-timing-function:steps(34)}100.0%{width:0px;animation-timing-function:step-end}100.0%{width:0px;animation-timing-function:step-end}}
      @keyframes b3{0.0%{width:0px;animation-timing-function:step-end}74.1306%{width:0px;animation-timing-function:steps(34)}85.3235%{width:509.78px;animation-timing-function:step-end}94.3018%{width:509.78px;animation-timing-function:steps(34)}100.0%{width:0px;animation-timing-function:step-end}100.0%{width:0px;animation-timing-function:step-end}}
    </style>
    <!--
      A dissolução vive numa máscara, não na cor.

      A primeira tentativa foi um gradiente radial no próprio preenchimento.
      Funcionava em frase curta e falhava nas longas: como o raio é
      proporcional à caixa, quanto maior a frase mais cedo a transparência
      começava, e o texto acabava com o começo e o fim caindo fora da barra —
      ilegíveis no tema claro. Aqui as paradas ficam em porcentagem pequena e
      fixa, então a barra é sólida ao longo de toda a frase e só dissolve nas
      pontas, que é onde ela some.

      São duas máscaras multiplicadas: a horizontal faz a dissolução das
      laterais, a vertical dá o respiro de cima e de baixo.
    -->
    <linearGradient id="lateral" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="6%" stop-color="#fff"/>
      <stop offset="94%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="vertical" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="16%" stop-color="#fff"/>
      <stop offset="84%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <!--
      maskContentUnits em objectBoundingBox: sem isso o retângulo da máscara
      mediria a viewport inteira (900px) e não a faixa, e a dissolução ficaria
      parada enquanto a barra cresce.
    -->
    <mask id="mLateral" maskContentUnits="objectBoundingBox">
      <rect width="1" height="1" fill="url(#lateral)"/>
    </mask>
    <mask id="mVertical" maskContentUnits="objectBoundingBox">
      <rect width="1" height="1" fill="url(#vertical)"/>
    </mask>


    <clipPath id="corte0"><rect class="corte c0" x="254.77" y="0" height="64"/></clipPath><clipPath id="corte1"><rect class="corte c1" x="214.38" y="0" height="64"/></clipPath><clipPath id="corte2"><rect class="corte c2" x="241.31" y="0" height="64"/></clipPath><clipPath id="corte3"><rect class="corte c3" x="221.11" y="0" height="64"/></clipPath>
  </defs>
  <g class="linha l0">
    <g mask="url(#mVertical)"><g mask="url(#mLateral)">
      <rect class="faixa" x="228.77" y="12"
            height="40" rx="6"/>
    </g></g>
    <g clip-path="url(#corte0)">
      <text x="254.77" y="32" dominant-baseline="central"
            font-family="Space Mono" font-weight="700" font-size="22"
            fill="#d0fa66" xml:space="preserve">Do banco de dados à interface</text>
    </g>
  </g>
  <g class="linha l1">
    <g mask="url(#mVertical)"><g mask="url(#mLateral)">
      <rect class="faixa" x="188.38" y="12"
            height="40" rx="6"/>
    </g></g>
    <g clip-path="url(#corte1)">
      <text x="214.38" y="32" dominant-baseline="central"
            font-family="Space Mono" font-weight="700" font-size="22"
            fill="#d0fa66" xml:space="preserve">Web, mobile e automação em produção</text>
    </g>
  </g>
  <g class="linha l2">
    <g mask="url(#mVertical)"><g mask="url(#mLateral)">
      <rect class="faixa" x="215.31" y="12"
            height="40" rx="6"/>
    </g></g>
    <g clip-path="url(#corte2)">
      <text x="241.31" y="32" dominant-baseline="central"
            font-family="Space Mono" font-weight="700" font-size="22"
            fill="#d0fa66" xml:space="preserve">Sistema que alguém usa todo dia</text>
    </g>
  </g>
  <g class="linha l3">
    <g mask="url(#mVertical)"><g mask="url(#mLateral)">
      <rect class="faixa" x="195.11" y="12"
            height="40" rx="6"/>
    </g></g>
    <g clip-path="url(#corte3)">
      <text x="221.11" y="32" dominant-baseline="central"
            font-family="Space Mono" font-weight="700" font-size="22"
            fill="#d0fa66" xml:space="preserve">Demo navegável &gt; screenshot bonito</text>
    </g>
  </g>
</svg>
